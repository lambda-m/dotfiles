# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Increase history (scrollback)
set -g history-limit 10000

# 1-based indexing of windows and panes, auto-renumber
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reduce escape delay (better for emacs/vim)
set -sg escape-time 10

# Enable focus events (useful for editors)
set -g focus-events on

# --- Nord color theme ---
# Nord palette
nord0="#2E3440"
nord1="#3B4252"
nord3="#4C566A"
nord4="#D8DEE9"
nord8="#88C0D0"

set -g status-style "bg=$nord1,fg=$nord4"
set -g pane-border-style "fg=$nord3"
set -g pane-active-border-style "fg=$nord8"
set -g message-style "bg=$nord1,fg=$nord4"
set -g status-left "#[bg=$nord8,fg=$nord0,bold] #S #[default] "
set -g status-right "#[fg=$nord4] %Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=$nord3,fg=$nord8,bold] #I:#W "
